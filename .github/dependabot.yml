# Weekly dependency-bump PRs. Every PR runs the full ci.yml suite (it fires
# on all pull requests), so a bump is merged only after the same gate as any
# other change — the "bump deliberately (re-resolve + full CI)" policy from
# backend/requirements.txt, with the PR drafted for us. Security advisories
# for already-pinned versions are picked up here as well as in the CI audit
# steps (pip-audit / npm audit), which fail the build if a pinned version is
# known-vulnerable. Updates are grouped per directory (one PR per ecosystem
# per check, not one per dependency — the ungrouped first run opened a PR
# per outdated dependency and flooded the queue). The pip entry covers BOTH
# requirements files in /backend in that one PR — keep the starlette pin in
# sync across them (see the comment in requirements-test.txt).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      backend:
        patterns:
          - "*"
    # ruff is deliberately pinned (see requirements-test.txt): 0.16+ changed
    # the default lint rule set, so any bump is a re-baseline decision, not a
    # routine update. Bump it by hand.
    ignore:
      - dependency-name: "ruff"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
    groups:
      e2e:
        patterns:
          - "*"
