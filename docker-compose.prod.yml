# Production stack (self-contained; see docker-compose.yml for dev).
#
# Run with: ./run-compose.sh prod up -d --build
#
# Requires in .env: PUBLIC_HOSTNAME, LETSENCRYPT_EMAIL (plus the usual
# POSTGRES_*, SECRET_KEY, etc.). Before first start: point the domain's DNS
# A/AAAA record(s) — and a www CNAME at the apex — at this server's public
# IP(s), and forward TCP 80/443 to it. www is 301-redirected to the apex
# (both names share one Let's Encrypt cert).

name: kindness-is-magic

services:
  traefik:
    image: traefik:v3.7
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect all HTTP to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt via HTTP-01 challenge on the web entrypoint
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:?SET LETSENCRYPT_EMAIL in .env}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme.json"
      - "--log.level=ERROR"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # acme.json must be mode 600 (see deploy notes: create before first up)
      - "traefik_certs:/etc/traefik"
    environment:
      - DOCKER_API_VERSION=1.44
    restart: unless-stopped
    networks:
      - kindnet

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    networks:
      - kindnet
    env_file:
      - .env
    volumes:
      - kindness_is_magic:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: prod
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${PUBLIC_HOSTNAME:?SET PUBLIC_HOSTNAME in .env}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.docker.network=kindnet"
    restart: unless-stopped
    networks:
      - kindnet

  frontend:
    build:
      context: ./frontend
      target: prod
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${PUBLIC_HOSTNAME:?SET PUBLIC_HOSTNAME in .env}`) && PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # www -> apex: permanent 301 (no dual-serving — auth cookies are
      # host-only). Joins the same Let's Encrypt cert (SAN); needs the www
      # CNAME for issuance and every 90-day renewal.
      - "traefik.http.routers.frontend-www.rule=Host(`www.${PUBLIC_HOSTNAME:?SET PUBLIC_HOSTNAME in .env}`)"
      - "traefik.http.routers.frontend-www.entrypoints=websecure"
      - "traefik.http.routers.frontend-www.tls=true"
      - "traefik.http.routers.frontend-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-www.middlewares=www-redirect"
      # v3 has no redirectHost middleware (removed in v3) — redirectRegex is
      # the equivalent. Note the doubled backslash/dollar: YAML unescapes \\\\.
      # to \\., and Compose unescapes $${1} to $1 for Traefik.
      - "traefik.http.middlewares.www-redirect.redirectRegex.regex=^https?://www\\.${PUBLIC_HOSTNAME:?SET PUBLIC_HOSTNAME in .env}(.*)"
      - "traefik.http.middlewares.www-redirect.redirectRegex.replacement=https://${PUBLIC_HOSTNAME:?SET PUBLIC_HOSTNAME in .env}$${1}"
      - "traefik.http.middlewares.www-redirect.redirectRegex.permanent=true"
      - "traefik.docker.network=kindnet"
    restart: unless-stopped
    networks:
      - kindnet

  # Daily DB backup (README "7. Backups"): installs a crontab at container
  # start, then idles. At 03:00 Pacific time (TZ=America/Los_Angeles,
  # DST-aware) the job pg_dumps into ./backups and prunes dumps older than
  # BACKUP_KEEP_DAYS days (default 7). Unhealthy in `prod ps` if no dump is
  # fresher than ~25 h.
  backups:
    image: postgres:15-alpine
    # Bypass the postgres entrypoint: this container only provides the pg_dump
    # client + busybox crond (same image as db, so dumps stay restorable).
    entrypoint: ["sh", "-c"]
    env_file:
      - .env
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - kindnet
    # The heredoc bakes credentials/retention into nightly-backup.sh at
    # container start; the cron line itself stays free of % and $ so crontab
    # parsing can't mangle it.
    command: |
      cat > /usr/local/bin/nightly-backup.sh <<EOF
      #!/bin/sh
      # Nightly DB backup, run by crond at 03:00 America/Los_Angeles.
      # Credentials and retention are baked in at container start.
      ts=\$$(date +%Y%m%d-%H%M%S)
      if PGPASSWORD='$${POSTGRES_PASSWORD}' pg_dump -h db -U '$${POSTGRES_USER}' '$${POSTGRES_DB}' > "/backups/kindness-backup-\$$ts.sql"; then
        echo "\$$(date): backup OK -> kindness-backup-\$$ts.sql"
        find /backups -name 'kindness-backup-*.sql' -mtime +$${BACKUP_KEEP_DAYS:-7} -delete
      else
        echo "\$$(date): backup FAILED - see pg_dump error above; partial file removed"
        rm -f "/backups/kindness-backup-\$$ts.sql"
      fi
      EOF
      chmod +x /usr/local/bin/nightly-backup.sh
      echo "0 3 * * * /usr/local/bin/nightly-backup.sh >> /var/log/backups.log 2>&1" | crontab -
      crond -f
    healthcheck:
      test: ["CMD-SHELL", "[ -n \"$(ls -t /backups/kindness-backup-*.sql 2>/dev/null | head -n1)\" ] && [ $(( $(date +%s) - $(stat -c %Y $(ls -t /backups/kindness-backup-*.sql 2>/dev/null | head -n1)) )) -lt 90000 ]"]
      interval: 10m
      timeout: 5s
      retries: 3

volumes:
  kindness_is_magic:
  traefik_certs:

networks:
  kindnet:
