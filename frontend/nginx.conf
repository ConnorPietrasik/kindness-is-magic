server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: client-side routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the one fixed-name file, and it points at this build's
    # content-hashed bundles. Without an explicit freshness lifetime, browsers
    # assign a *heuristic* one (~10% of its age since Last-Modified) and can
    # serve a stale copy after a deploy that references the previous build's
    # now-deleted bundles -> 404s -> blank app until a hard refresh. no-cache
    # keeps ETag/Last-Modified revalidation (cheap 304s) but forces a check
    # before every use. It must be its own `=` location: the SPA fallback is an
    # internal redirect to /index.html, and nginx add_header is block-scoped,
    # so a header on `location /` would not reach it.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Vite emits content-hashed, immutable assets. One Cache-Control line
    # carries both directives: the long max-age (older clients, notably
    # some Safari versions, ignore `immutable`), and `immutable` itself
    # (so even past expiry the browser won't revalidate — a hashed name
    # never maps to different content). The single line is deliberate:
    # `expires 1y` plus a separate add_header would emit two
    # Cache-Control header lines.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
