line-length = 140

# Deliberately below the production runtime (backend/Dockerfile:
# python:3.14-slim): keeps the pinned ruff from emitting 3.12+ syntax (e.g.
# same-quoted nested f-strings) or shifting lint rule selection, which a
# py314 target would reformat across the codebase.
target-version = "py311"

[lint]
ignore = ["E712"]
